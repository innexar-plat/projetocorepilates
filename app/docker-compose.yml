services:
  db:
    image: postgres:16-alpine
    container_name: core-pilates-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: core_pilates
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d core_pilates"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: core-pilates-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: core-pilates-minio-init
    depends_on:
      minio:
        condition: service_started
    env_file:
      - .env.docker
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/$${MINIO_BUCKET} || true;
      mc anonymous set download local/$${MINIO_BUCKET} || true;
      exit 0;'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: core-pilates-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/core_pilates
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      MINIO_ENDPOINT: minio
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    command: sh -c "npx prisma db push --accept-data-loss && npm run start"

volumes:
  postgres_data:
  minio_data:
